name: Kifu Analysis Batch

on:
  workflow_dispatch:

concurrency:
  group: kifu-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore engine assets cache
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine
          key: engine-${{ vars.USI_ENGINE_BINARY_SHA256 || 'custom' }}-${{ vars.USI_EVAL_SHA256 || 'noeval' }}

      - name: Fetch engine & eval
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          USI_ENGINE_BINARY_URL: ${{ vars.USI_ENGINE_BINARY_URL }}
          USI_ENGINE_BINARY_SHA256: ${{ vars.USI_ENGINE_BINARY_SHA256 }}
          USI_EVAL_URL: ${{ vars.USI_EVAL_URL }}
          USI_EVAL_SHA256: ${{ vars.USI_EVAL_SHA256 }}
        run: bash ./scripts/fetch-engine.sh

      - name: Install worker deps
        run: npm install --prefix workers/analysis-runner

      - name: Run analysis worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ENGINE_PATH: ./engine/usi-engine
          EVAL_DIR: ./engine/eval
          MAX_GAMES_PER_RUN: '30'
          GO_NODES: '200000'
          TIME_BUDGET_SEC: '480'
        run: node workers/analysis-runner/src/index.js
