    <style>
      html,
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 35%, #1e293b 0%, #020617 70%);
        padding: 24px;
        text-align: center;
      }
      .boot-splash-emblem {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 900;
        color: #020617;
        box-shadow: 0 12px 32px rgba(245, 158, 11, 0.25);
        font-family: 'Noto Serif JP', serif;
      }
      .boot-splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #fef3c7;
        margin: 0;
      }
      .boot-splash-sub {
        font-size: 12px;
        color: #94a3b8;
        margin: 0;
      }
      .boot-splash-bar {
        width: 160px;
        height: 3px;
        border-radius: 9999px;
        background: #1e293b;
        overflow: hidden;
        margin-top: 6px;
      }
      .boot-splash-bar-inner {
        width: 45%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #d97706, #fbbf24);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
